<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineScope | Tableau Analytics</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
          rel="stylesheet">

    <style>
        .tableau-page {
            max-width: 1500px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .tableau-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .tableau-heading h1 {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            margin-bottom: 10px;
        }

        .tableau-heading p {
            font-family: 'DM Sans', sans-serif;
            color: #777;
            font-size: 16px;
        }

        .tableau-container {
            width: 100%;
            min-height: 900px;
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .tableau-container iframe {
            width: 100%;
            height: 1000px;
            border: none;
        }

        @media (max-width: 768px) {
            .tableau-heading h1 {
                font-size: 28px;
            }

            .tableau-container iframe {
                height: 1800px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="/">Home</a>
        <a href="/recommendations">Recommendations</a>
        <a href="/analytics">Analytics</a>
        <a href="/tableau-analytics" class="active">Tableau Analytics</a>
    </nav>

    <main class="tableau-page">

        <section class="tableau-heading">
            <h1>CineScope Movie Analytics</h1>
            <p>
                Explore interactive visualizations and discover insights
                from movie ratings, genres, users and release trends.
            </p>
        </section>

        <section class="tableau-container">

            <iframe
                src="https://public.tableau.com/views/CineScopeMovieAnalyticsDashboard/Dashboard1?:showVizHome=no&:embed=true"
                title="CineScope Tableau Analytics Dashboard"
                allowfullscreen>
            </iframe>

        </section>

    </main>

</body>
</html>
